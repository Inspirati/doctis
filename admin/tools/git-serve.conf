# git-serve.conf — Authenticated Smart-HTTP access to Doctis project repositories.
#
# Routes /git/<slug>.git/<service> to the Doctis PHP gateway (git_http.php),
# which authenticates the caller via a Doctis API token (HTTP Basic password)
# and authorises project-level access before proxying to git-http-backend.
#
# READ-ONLY in this phase: clone/fetch only; push is rejected by the gateway.
#
# Install on the server:
#   sudo cp admin/tools/git-serve.conf /etc/apache2/conf-available/git-serve.conf
#   sudo a2enconf git-serve && sudo systemctl reload apache2
# Disable:
#   sudo a2disconf git-serve && sudo systemctl reload apache2
#
# Requires $g_git_http_enabled = ON in config/config_inc.php.
#
# Clone URL:  http://<host>/git/<slug>.git
# Example:    git clone http://manager:<API_TOKEN>@10.0.0.10/git/example.git

Alias /git /var/www/html/doctis/git_http.php

<Files "git_http.php">
    Require all granted
</Files>

# Deliver the trailing /<slug>.git/<service> to the script as PATH_INFO.
AcceptPathInfo On

# Preserve the Authorization header for PHP (some configurations strip it so
# that PHP_AUTH_* is not populated).
SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
