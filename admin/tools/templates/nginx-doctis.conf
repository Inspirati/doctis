server {
    listen 80;
    server_name @HOST@;
    root /var/www/html;
    index index.php;
    client_max_body_size 64M;

    location = / { return 302 /doctis/; }
    # Installation is possible locally; never expose administrative scripts publicly.
    location = /doctis/admin/install.php {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/doctis.sock;
    }
    location ~ /\. { return 403; }
    location ~ ^/doctis/vendor/dapphp/securimage/(securimage_show|securimage_play)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/doctis.sock;
    }
    location ~ ^/doctis/vendor/dapphp/securimage/.+\.(js|css|png|gif|jpe?g|wav|mp3|ogg)$ { }
    location ~ ^/doctis/(admin|config|vendor|core|lang|plugins|library|scripts|build|tests|doc|docbook|uploads)(/|$) { return 403; }
    location ~ ^/doctis/api/rest/restcore(/|$) { return 403; }
    location /doctis/api/rest/ {
        try_files $uri $uri/ /doctis/api/rest/index.php$is_args$args;
    }
    location ~ ^/git/(.+)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/doctis/git_http.php;
        fastcgi_param PATH_INFO /$1;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/doctis.sock;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/doctis.sock;
    }
    location ~* \.(sh|sql|ini|log|md|lock|json|ya?ml|xml)$ { return 403; }
    location / { try_files $uri $uri/ =404; }
    access_log /var/log/nginx/doctis_access.log;
    error_log /var/log/nginx/doctis_error.log;
}
